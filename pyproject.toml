[project]
name = "industrial-ai-agent-benchmark"
version = "0.1.0"
description = "Efficient AI Agents for Industrial Automation: Benchmarking SLMs, Tools, and Verification"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "llama-cpp-python>=0.2.90",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "pytest>=8.0.0",
    "psutil>=5.9.0",
    "matplotlib>=3.8.0",
    "ortools>=9.8.0",
]

[project.scripts]
generate-data = "data.generate_factory_data:main"
run-benchmark = "src.evaluation.runner:main"
mcp-server = "src.tools.factory_mcp_server:main"
